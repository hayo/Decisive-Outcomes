# Rolt de website uit bij elke push naar de branch deploy.
# Uitrollen: git push origin main:deploy
# Zie website/CLAUDE.md, onder Deployment. Benodigde GitHub Secrets:
#   DEPLOY_HOST         hostnaam van de server
#   DEPLOY_USER         gebruikersnaam
#   DEPLOY_PASSWORD     wachtwoord
#   DEPLOY_KNOWN_HOSTS  uitvoer van: ssh-keyscan -p <poort> <host>
#                       (geheim omdat de hostnaam erin staat)
# De rest staat hieronder bij env.
name: Deploy website

on:
  push:
    branches: [deploy]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  DEPLOY_PORT: '22'
  # Map op de server waarin public/, includes/ en content/ komen.
  DEPLOY_PATH: ''

jobs:
  deploy:
    # Alleen vanaf de branch deploy, ook bij handmatig starten.
    if: github.ref == 'refs/heads/deploy'
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: PHP-syntax controleren
        run: find website -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Melding als de server nog niet is ingesteld
        if: env.DEPLOY_HOST == ''
        run: echo "::notice::Geen DEPLOY_HOST ingesteld; alleen gecontroleerd, niet geüpload."

      - name: Pad op de server controleren
        if: env.DEPLOY_HOST != '' && env.DEPLOY_PATH == ''
        run: |
          echo "::error::DEPLOY_PATH is leeg; vul het pad in bovenaan deploy.yml."
          exit 1

      - name: Wijzigingstijden herstellen uit git
        if: env.DEPLOY_HOST != ''
        # Zo uploadt lftp alleen bestanden die echt gewijzigd zijn.
        run: |
          git ls-files website | while IFS= read -r f; do
            touch -d "$(git log -1 --format=%cI -- "$f")" "$f"
          done

      - name: lftp installeren
        if: env.DEPLOY_HOST != ''
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Uploaden
        if: env.DEPLOY_HOST != ''
        env:
          USER: ${{ secrets.DEPLOY_USER }}
          LFTP_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # Nooit --delete: bestanden op de server die niet uit de repo komen blijven staan.
          # config.php wordt nooit overschreven.
          lftp --env-password -u "$USER" -p "$DEPLOY_PORT" "sftp://$DEPLOY_HOST" -e "
            set sftp:auto-confirm no;
            set net:max-retries 2;
            mirror --reverse --only-newer --no-perms --verbose --exclude-glob config.php website/public   $DEPLOY_PATH/public;
            mirror --reverse --only-newer --no-perms --verbose --exclude-glob config.php website/includes $DEPLOY_PATH/includes;
            mirror --reverse --only-newer --no-perms --verbose website/content  $DEPLOY_PATH/content;
            bye"
